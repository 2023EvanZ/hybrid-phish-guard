<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Side panel harness</title></head>
<body>
<!-- Test-only: renders the built side panel (dist/) with stubbed chrome.* APIs, so the
     panel UI can be checked in a normal browser tab. ?state= picks what is stored:
     phishing (default), suspicious, device, cloud, cloud-failed, skipped, trusted, none. -->
<script type="module">
  const params = new URLSearchParams(location.search);
  const state = params.get("state") ?? "phishing";
  const report = await (await fetch("/test/fixtures/sample-report.json")).json();
  const verdict = await (await fetch("/test/fixtures/sample-verdict.json")).json();
  if (state === "suspicious") Object.assign(verdict.triage.final, { verdict: "suspicious", confidence: 0.5 });
  const nano = { verdict: "suspicious", confidence: 0.62, reasons: [], source: "on-device", latencyMs: 1790 };
  if (state === "device") {
    Object.assign(verdict.triage, { local: { ...nano, verdict: "phishing", confidence: 0.95 }, escalation: { escalate: false, reason: "confident" } });
    verdict.triage.final = verdict.triage.local;
  }
  if (state === "cloud" || state === "cloud-failed") {
    const sent = await (await fetch("/test/fixtures/sample-sent.json")).json();
    Object.assign(verdict.triage, { local: nano, escalation: { escalate: true, reason: "low-confidence" }, sentToCloud: sent });
    if (state === "cloud") {
      verdict.triage.cloud = { ...verdict.triage.final, source: "cloud", confidence: 0.93, latencyMs: 1120 };
      verdict.triage.final = verdict.triage.cloud;
    } else {
      verdict.triage.final = nano;
      verdict.triage.errors = ["cloud model: quota exceeded"];
    }
  }
  const store = {};
  const local = { trustedSites: ["portal.example-utility.com"] };
  // ?stats=none leaves the privacy counts unset (a fresh install).
  if (params.get("stats") !== "none") local.privacyStats = { pages: 214, sentPages: 16, since: "2026-11-20T12:00:00.000Z" };
  if (state !== "none") store["tab:1"] = state === "skipped" ? { url: report.url, prefilter: { shouldCheck: false, score: 0, reasons: [] } } : report;
  if (!["none", "skipped", "trusted"].includes(state)) store["verdict:1"] = verdict;
  if (state === "trusted") local.trustedSites.push(new URL(report.url).hostname);
  const listeners = [];
  const noop = { addListener() {} };
  const changed = { addListener(fn) { listeners.push(fn); } };
  const pick = (src, keys) => Object.fromEntries([keys].flat().filter((k) => k in src).map((k) => [k, src[k]]));
  window.__harness = { store, local };
  window.chrome = {
    tabs: { query: async () => [{ id: 1 }], sendMessage: async (_id, msg) => (msg.type === "hpg/features" ? report.features : report), onActivated: noop, onUpdated: noop },
    runtime: {
      // Mirrors the background's trustTab: suspicious verdicts only.
      async sendMessage(msg) {
        if (msg.type === "hpg/reset-stats") {
          local.privacyStats = { pages: 0, sentPages: 0, since: new Date().toISOString() };
          listeners.forEach((fn) => fn({}));
          return { ok: true };
        }
        if (msg.type !== "hpg/trust-tab") return undefined;
        const v = store["verdict:1"];
        if (v?.triage.final.verdict !== "suspicious") return { host: null };
        const host = new URL(v.url).hostname;
        local.trustedSites = [...new Set([...local.trustedSites, host])].sort();
        delete store["verdict:1"];
        listeners.forEach((fn) => fn({}));
        return { host };
      },
    },
    storage: {
      session: { get: async (keys) => pick(store, keys), onChanged: changed },
      local: {
        get: async (keys) => pick(local, keys),
        set: async (items) => { Object.assign(local, items); listeners.forEach((fn) => fn(items)); },
        onChanged: changed,
      },
    },
  };
  const html = await (await fetch("/dist/sidepanel.html")).text();
  const parsed = new DOMParser().parseFromString(html, "text/html");
  document.head.append(...parsed.head.querySelectorAll("style"));
  document.body.innerHTML = parsed.body.innerHTML;
  await import("/dist/sidepanel.js");
</script>
</body>
</html>
