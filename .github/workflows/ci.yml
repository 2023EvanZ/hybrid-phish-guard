name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Pushes and pull requests scan only their new commits for secrets; these scan the
  # full history (see secret-scan below).
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

# Read-only by default; no job here needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the comment) so a moved or hijacked tag
# can't change what runs.
jobs:
  build-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Rules-engine eval (dev and held-out)
        run: npm run eval
      - name: Development build
        run: npm run build
      # Exercises the same build and checks (no sourcemaps, no debug token, config present)
      # as a real release. The placeholder config makes a zip that can't reach the cloud
      # model; it's uploaded only so the build output can be inspected, never shipped.
      - name: Release build and checks (placeholder Firebase config)
        run: npm run build:release
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: ci-placeholder
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip-placeholder-config
          path: release/*.zip
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # On push and pull_request, gitleaks-action scans only the new commits; on
      # workflow_dispatch and schedule it scans the full history.
      # Free for personal-account repos (no GITLEAKS_LICENSE needed).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
